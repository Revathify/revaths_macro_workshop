name: Bump, package, and release addon

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: addon-release
  cancel-in-progress: false

jobs:
  release:
    name: Bump version and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^## Version:[[:space:]]*([0-9]+)\.([0-9]+)\.([0-9]+)[[:space:]]*$/\1 \2 \3/p' RevathsTooltipHelper.toc)
          if [ -z "$version" ]; then
            echo "Could not find a semantic version in RevathsTooltipHelper.toc" >&2
            exit 1
          fi

          read -r major minor patch <<< "$version"
          next_version="$major.$minor.$((patch + 1))"
          sed -i -E "s/^## Version:.*/## Version: $next_version/" RevathsTooltipHelper.toc
          release_tag="v$next_version"

          if git ls-remote --exit-code origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Release tag $release_tag already exists; nothing to publish."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RevathsTooltipHelper.toc
          git commit -m "Bump addon version to $next_version [skip ci]"
          git tag "$release_tag"
          git push origin HEAD:main "$release_tag"

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Package addon
        if: steps.version.outputs.should_release == 'true'
        id: package
        shell: bash
        run: |
          staging="$RUNNER_TEMP/revaths-tooltip-helper-release"
          addon_target="$staging/RevathsTooltipHelper"
          zip_name="RevathsTooltipHelper-${{ steps.version.outputs.release_tag }}.zip"
          zip_path="$RUNNER_TEMP/$zip_name"

          mkdir -p "$addon_target"
          cp RevathsTooltipHelper.toc RevathsTooltipHelper.lua "$addon_target/"
          (cd "$staging" && zip -r "$zip_path" RevathsTooltipHelper)

          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        if: steps.version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          gh release create "$RELEASE_TAG" "$ZIP_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Revath's Tooltip Helper $RELEASE_TAG" \
            --generate-notes